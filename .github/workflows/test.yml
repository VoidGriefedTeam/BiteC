name: Chewer Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest

    env:
      ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Check MSVC
        shell: pwsh
        run: |
          cl

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --preset ninja-debug

      - name: Inspect zlib
        shell: pwsh
        run: |
          Write-Host "=== zlib install directory ==="
          Get-ChildItem "$env:ROOT\build\zlib-install" -Recurse |
            Select-Object FullName

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --build --preset ninja-debug
      
      - name: Test Chewer
        shell: pwsh
        run: |
          cd build

          .\bitec.exe "$env:ROOT\examples\bit.bite" -o "$env:ROOT\build\bit.obj" windows

          $output = "3" | .\bit.exe

          Write-Host "Program returned: $output"

          if ($output.Trim() -ne "3") {
              throw "Expected 3, got $output"
          }

  test-linux:
    runs-on: windows-latest

    env:
      ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --preset ninja-debug

      - name: Inspect zlib
        shell: pwsh
        run: |
          Write-Host "=== zlib install directory ==="
          Get-ChildItem "$env:ROOT\build\zlib-install" -Recurse |
            Select-Object FullName

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --build --preset ninja-debug

      - name: Test Linux Target
        shell: pwsh
        run: |
          cd build

          .\bitec.exe "$env:ROOT\examples\bit.bite" -o "$env:ROOT\build\bit.o" linux64

          $linuxPath = wsl wslpath -a "$env:ROOT/build/bit"

          Write-Host "Linux executable: $linuxPath"

          $output = wsl bash -c "echo 3 | '$linuxPath'"

          Write-Host "Program returned: $output"

          if ($output.Trim() -ne "3") {
              throw "Expected 3, got $output"
          }