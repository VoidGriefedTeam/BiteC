name: Chewer Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest

    env:
      ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check Toolchain
        shell: pwsh
        run: |
          cl
          clang --version
          lld-link --version
          cmake --version
          ninja --version

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --preset ninja-debug
          cmake --build --preset ninja-debug

      - name: Test Windows Target
        shell: pwsh
        run: |
          cd build

          .\bitec.exe "$env:ROOT\examples\bit.bite" windows -o "$env:ROOT\build\bit.obj"

          $output = "3" | .\bit.exe

          Write-Host "Program returned: $output"

          if ($output.Trim() -ne "3") {
              throw "Expected 3, got $output"
          }


  test-linux:
    runs-on: ubuntu-latest

    env:
      ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang lld

      - name: Check Toolchain
        run: |
          clang --version
          lld --version
          cmake --version
          ninja --version

      - name: Build Chewer
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build

      - name: Test Linux Target
        run: |
          cd build

          ./bitec "$ROOT/examples/bit.bite" linux64 -o "$ROOT/build/bit.o"

          chmod +x "$ROOT/build/bit"

          output=$(echo 3 | "$ROOT/build/bit")

          echo "Program returned: $output"

          if [ "$(echo "$output" | xargs)" != "3" ]; then
            echo "Expected 3, got $output"
            exit 1
          fi