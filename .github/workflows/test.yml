name: Chewer Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest

    env:
      ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"

          New-Item -ItemType Directory -Force -Path "C:\LLVM" | Out-Null

          tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" `
            -C "C:\LLVM" `
            --strip-components=1

          $env:PATH = "C:\LLVM\bin;$env:PATH"
          Add-Content $env:GITHUB_PATH "C:\LLVM\bin"

          Write-Host "LLVM installed:"
          clang --version
          lld-link --version

          Write-Host "`nLLVMConfig.cmake:"
          Get-ChildItem "C:\LLVM" -Recurse -Filter "LLVMConfig.cmake" |
            Select-Object -ExpandProperty FullName

      - name: Patch LLVM DIA dependency
        shell: pwsh
        run: |
          $exports = "C:\LLVM\lib\cmake\llvm\LLVMExports.cmake"

          if (!(Test-Path $exports)) {
              throw "LLVMExports.cmake not found!"
          }

          $text = Get-Content $exports -Raw

          $old = 'C:/Program Files (x86)/Microsoft Visual Studio/2019/Professional/DIA SDK/lib/amd64/diaguids.lib'
          $new = '$ENV{VSINSTALLDIR}/DIA SDK/lib/amd64/diaguids.lib'

          if (!$text.Contains($old)) {
              throw "Expected hardcoded VS2019 DIA path was not found!"
          }

          $text = $text.Replace($old, $new)

          Set-Content `
            -Path $exports `
            -Value $text `
            -NoNewline

          Write-Host "LLVM DIA dependency patched:"
          Select-String `
            -Path $exports `
            -Pattern "LLVMDebugInfoPDB|diaguids.lib"

      - name: Find LLVM CMake config
        shell: pwsh
        run: |
          $config = Get-ChildItem "C:\LLVM" `
            -Recurse `
            -Filter "LLVMConfig.cmake" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $config) {
              throw "LLVMConfig.cmake was not found!"
          }

          Write-Host "LLVMConfig.cmake found at:"
          Write-Host $config.FullName

          Write-Host "LLVM_DIR:"
          Write-Host $config.DirectoryName
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Check MSVC
        shell: pwsh
        run: |
          cl
      
      - name: Build Chewer
        shell: pwsh
        run: |
          $env:LLVM_DIR = "C:\Program Files\LLVM\lib\cmake\llvm"

      - name: Configure Chewer
        shell: pwsh
        run: |
            $env:LLVM_DIR = "C:\LLVM\lib\cmake\llvm"
            cmake --preset ninja-debug

      - name: Inspect zlib
        shell: pwsh
        run: |
          Write-Host "=== zlib install directory ==="
          Get-ChildItem "$env:ROOT\build\zlib-install" -Recurse |
            Select-Object FullName

      - name: Diagnose DIA SDK reference
        shell: pwsh
        run: |
          Write-Host "Searching generated CMake files for diaguids.lib..."

          Get-ChildItem build -Recurse -File -ErrorAction SilentlyContinue |
            Select-String -Pattern "diaguids.lib|Visual Studio[\\/]+2019" -ErrorAction SilentlyContinue |
            Select-Object Path, LineNumber, Line

      - name: Test bundled linker
        shell: pwsh
        run: |
          $lld = "$env:ROOT\build\runtime\windows\bin\ld.lld.exe"

          Write-Host "Linker:"
          Get-Item $lld | Format-List FullName,Length

          Write-Host "`nTrying linker directly:"
          & $lld --version

          if ($LASTEXITCODE -ne 0) {
              throw "Bundled ld.lld.exe failed to start. Exit code: $LASTEXITCODE"
          }

      - name: Inspect bundled runtime
        shell: pwsh
        run: |
          Get-ChildItem "$env:ROOT\build\runtime\windows" -Recurse -File |
            Select-Object FullName, Length

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --build --preset ninja-debug
      
      - name: Test Chewer
        shell: pwsh
        run: |
          cd build

          .\bitec.exe "$env:ROOT\examples\bit.bite" -o "$env:ROOT\build\bit.obj" windows --verbose

          $output = "3" | .\bit.exe

          Write-Host "Program returned: $output"

          if ($output.Trim() -ne "3") {
              throw "Expected 3, got $output"
          }

  test-linux:
    runs-on: windows-latest

    env:
      ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --preset ninja-debug

      - name: Inspect zlib
        shell: pwsh
        run: |
          Write-Host "=== zlib install directory ==="
          Get-ChildItem "$env:ROOT\build\zlib-install" -Recurse |
            Select-Object FullName

      - name: Build Chewer
        shell: pwsh
        run: |
          cmake --build --preset ninja-debug

      - name: Test Linux Target
        shell: pwsh
        run: |
          cd build

          .\bitec.exe "$env:ROOT\examples\bit.bite" -o "$env:ROOT\build\bit.o" linux64

          $linuxPath = wsl wslpath -a "$env:ROOT/build/bit"

          Write-Host "Linux executable: $linuxPath"

          $output = wsl bash -c "echo 3 | '$linuxPath'"

          Write-Host "Program returned: $output"

          if ($output.Trim() -ne "3") {
              throw "Expected 3, got $output"
          }